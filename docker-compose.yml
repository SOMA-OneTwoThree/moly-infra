services:
  backend:
    # IMAGE_TAG/IMAGE_REPO는 deploy.sh가 생성하는 .env에서 온다(git-sha 고정).
    # IMAGE_REPO 기본값 moly-backend = prod — IMAGE_REPO 줄이 없는 구 .env로도 prod가
    # 기존과 동일하게 뜬다. dev 호스트만 deploy.sh가 moly-backend-dev를 써 넣는다.
    # :latest 폴백은 첫 수동 기동용 — 평시엔 deploy.sh가 항상 .env를 만들어 둔다.
    image: 676972757138.dkr.ecr.ap-northeast-2.amazonaws.com/${IMAGE_REPO:-moly-backend}:${IMAGE_TAG:-latest}
    container_name: moly-backend
    ports:
      - "127.0.0.1:8000:8000"   # 루프백만 바인딩 — 외부는 nginx(443)를 통해서만
    env_file:
      - ./backend.env           # deploy.sh가 SSM에서 생성 (git 제외)
    volumes:
      # FCM 서비스 계정 JSON — deploy.sh가 SSM에서 파일로 생성.
      # 파일이 없으면 컨테이너가 안 뜨므로 deploy.sh가 없을 때 빈 파일이라도 만든다.
      - ./secrets/fcm-service-account.json:/secrets/fcm-service-account.json:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"   # 로그 무제한 누적으로 디스크 차는 것 방지
        max-file: "3"
    healthcheck:
      # slim 이미지에 curl 없음 — 파이썬 표준 라이브러리로 /health 확인
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # 배치 워커 — 상주 아님. systemd timer(moly-worker.timer)가 매시 정각
  # `docker compose run --rm worker`로 1틱 실행(멱등). profiles 덕분에
  # `up -d`로는 안 뜨고, run으로만 실행된다.
  worker:
    image: 676972757138.dkr.ecr.ap-northeast-2.amazonaws.com/${IMAGE_REPO:-moly-backend}:${IMAGE_TAG:-latest}
    profiles: ["worker"]
    command: ["python", "-m", "worker"]
    env_file:
      - ./backend.env
    volumes:
      - ./secrets/fcm-service-account.json:/secrets/fcm-service-account.json:ro
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 대화 후속 잡(memory/profile/checkpoint)을 처리하는 상주 consumer.
  # dev에서만 deploy.sh가 consumer profile을 켜서 기동한다. prod는 별도 전환 전까지 미기동.
  consumer:
    image: 676972757138.dkr.ecr.ap-northeast-2.amazonaws.com/${IMAGE_REPO:-moly-backend}:${IMAGE_TAG:-latest}
    container_name: moly-consumer
    profiles: ["consumer"]
    command: ["python", "-m", "worker.consumer"]
    env_file:
      - ./backend.env
    volumes:
      - ./secrets/fcm-service-account.json:/secrets/fcm-service-account.json:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

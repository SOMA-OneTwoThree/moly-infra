services:
  backend:
    image: 676972757138.dkr.ecr.ap-northeast-2.amazonaws.com/moly-backend:latest
    container_name: moly-backend
    ports:
      - "127.0.0.1:8000:8000"   # 루프백만 바인딩 — 외부는 nginx(443)를 통해서만
    env_file:
      - ./backend.env           # deploy.sh가 SSM에서 생성 (git 제외)
    volumes:
      # FCM 서비스 계정 JSON — deploy.sh가 SSM에서 파일로 생성.
      # 파일이 없으면 컨테이너가 안 뜨므로 deploy.sh가 없을 때 빈 파일이라도 만든다.
      - ./secrets/fcm-service-account.json:/secrets/fcm-service-account.json:ro
    restart: unless-stopped
    healthcheck:
      # slim 이미지에 curl 없음 — 파이썬 표준 라이브러리로 /health 확인
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # 배치 워커 — 상주 아님. systemd timer(moly-worker.timer)가 매시 정각
  # `docker compose run --rm worker`로 1틱 실행(멱등). profiles 덕분에
  # `up -d`로는 안 뜨고, run으로만 실행된다.
  worker:
    image: 676972757138.dkr.ecr.ap-northeast-2.amazonaws.com/moly-backend:latest
    profiles: ["worker"]
    command: ["python", "-m", "worker"]
    env_file:
      - ./backend.env
    volumes:
      - ./secrets/fcm-service-account.json:/secrets/fcm-service-account.json:ro
    restart: "no"

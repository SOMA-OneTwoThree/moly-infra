services:
  backend:
    # IMAGE_TAG와 IMAGE_REPO는 deploy.sh가 만드는 .env에서 읽는다. IMAGE_REPO가 없으면 prod 저장소를 쓴다.
    # :latest는 .env가 아직 없는 첫 수동 기동에서만 쓰인다.
    image: 676972757138.dkr.ecr.ap-northeast-2.amazonaws.com/${IMAGE_REPO:-moly-backend}:${IMAGE_TAG:-latest}
    container_name: moly-backend
    ports:
      - "127.0.0.1:8000:8000"   # 외부 요청은 nginx :8080을 거쳐서만 들어온다
    env_file:
      - ./backend.env           # deploy.sh가 SSM 값으로 생성
    volumes:
      # FCM 서비스 계정 파일. 파일이 없으면 컨테이너가 뜨지 않아서 deploy.sh가 빈 파일이라도 만든다.
      - ./secrets/fcm-service-account.json:/secrets/fcm-service-account.json:ro
    restart: unless-stopped
    # 로그는 호스트 journald에 남긴다. 컨테이너를 다시 만든 뒤에도 journalctl -t moly-backend로 볼 수 있다.
    logging:
      driver: journald
      options:
        tag: moly-backend
    healthcheck:
      # slim 이미지에는 curl이 없어서 파이썬으로 확인한다.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # 배치 워커. 상주하지 않고 moly-worker.timer가 15분마다 `docker compose run --rm worker`로 실행한다.
  # worker profile에 속해 있어 `up -d`로는 뜨지 않는다.
  worker:
    image: 676972757138.dkr.ecr.ap-northeast-2.amazonaws.com/${IMAGE_REPO:-moly-backend}:${IMAGE_TAG:-latest}
    profiles: ["worker"]
    command: ["python", "-m", "worker"]
    env_file:
      - ./backend.env
    volumes:
      - ./secrets/fcm-service-account.json:/secrets/fcm-service-account.json:ro
    restart: "no"
    # systemd가 시간 제한으로 run을 끊은 뒤에도 컨테이너가 남기는 로그까지 journald에 보존한다.
    logging:
      driver: journald
      options:
        tag: moly-worker

  # 대화 이후의 비동기 작업을 처리하는 상주 consumer. deploy.sh가 consumer profile로 띄운다.
  # 작업을 FOR UPDATE SKIP LOCKED로 나눠 가져가므로 워커와 달리 모든 서버에서 실행한다.
  consumer:
    image: 676972757138.dkr.ecr.ap-northeast-2.amazonaws.com/${IMAGE_REPO:-moly-backend}:${IMAGE_TAG:-latest}
    container_name: moly-consumer
    profiles: ["consumer"]
    command: ["python", "-m", "worker.consumer"]
    env_file:
      - ./backend.env
    volumes:
      - ./secrets/fcm-service-account.json:/secrets/fcm-service-account.json:ro
    restart: unless-stopped
    logging:
      driver: journald
      options:
        tag: moly-consumer

# ALB 전용 블록 — Target Group(HTTP:8080)이 여기로 들어온다. TLS는 ALB(ACM)가 종료.
#
# 반영(수동): cp nginx/alb-8080.conf /etc/nginx/sites-available/alb-8080
#            ln -sf /etc/nginx/sites-available/alb-8080 /etc/nginx/sites-enabled/alb-8080
#            nginx -t && systemctl reload nginx
# deploy.sh의 헬스 게이트가 127.0.0.1:8080/health로 이 경로의 드리프트를 감지한다.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    client_max_body_size 1m;

    # ALB가 붙인 X-Forwarded-For에서 실제 클라이언트 IP 복원 — 없으면 액세스 로그가
    # 전부 ALB 사설 IP로 남아 어뷰즈 조사 불가, 향후 rate limit 도입 시 ALB를 밴하게 된다
    set_real_ip_from 10.20.0.0/16;      # VPC CIDR
    real_ip_header X-Forwarded-For;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 이 블록은 ALB(HTTPS 종료 후) 트래픽만 받으므로 리터럴이 안전 —
        # 패스스루는 로컬 curl 게이트 요청에서 빈 값이 되어 헤더가 사라진다
        proxy_set_header X-Forwarded-Proto https;
        # LLM 응답 생성이 길어질 수 있음 — ALB idle(125s)보다 짧게 유지해 nginx가 먼저 끊게 한다
        proxy_read_timeout 120s;
    }
}

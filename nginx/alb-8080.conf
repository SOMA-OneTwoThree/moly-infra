# ALB Target Group(HTTP 8080)에서 오는 요청을 backend로 전달한다. TLS는 ALB에서 끝난다.
#
# 서버 반영: cp nginx/alb-8080.conf /etc/nginx/sites-available/alb-8080
#            ln -sf /etc/nginx/sites-available/alb-8080 /etc/nginx/sites-enabled/alb-8080
#            nginx -t && systemctl reload nginx
# deploy.sh가 배포할 때마다 127.0.0.1:8080/health로 이 경로를 확인한다.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    client_max_body_size 1m;

    # ALB가 넣어 준 X-Forwarded-For로 실제 클라이언트 IP를 복원한다. 없으면 로그에 ALB 내부 IP만 남는다.
    set_real_ip_from 10.20.0.0/16;      # VPC CIDR
    real_ip_header X-Forwarded-For;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 이 블록에는 ALB가 HTTPS를 처리한 요청만 들어오므로 https로 고정한다.
        # 받은 값을 그대로 넘기면 배포 스크립트의 로컬 curl 요청에서는 헤더가 비어 버린다.
        proxy_set_header X-Forwarded-Proto https;
        # LLM 응답은 오래 걸릴 수 있다. ALB idle timeout(125s)보다 짧게 둬서 nginx가 먼저 끊게 한다.
        proxy_read_timeout 120s;
    }
}

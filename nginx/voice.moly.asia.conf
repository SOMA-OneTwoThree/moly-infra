# nginx 설정 참조본 — EC2의 /etc/nginx/sites-available/default 에 수동 반영한다.
# (nginx 설정은 호스트 소유라 deploy.sh가 건드리지 않는다. 변경 시 이 파일을 고치고
#  EC2에 복사 → nginx -t → systemctl reload nginx)
#
# 변경 이력: ai-voice(8001, WebSocket) → moly-backend(8000, 일반 HTTP) 프록시로 전환.
# 인증서 경로는 기존 certbot 발급분 그대로 사용 (자동 갱신 certbot.timer 유지).

server {
    listen 80;
    listen [::]:80;
    server_name voice.moly.asia;
    # HTTP → HTTPS 리다이렉트 (certbot 표준)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name voice.moly.asia;

    ssl_certificate /etc/letsencrypt/live/voice.moly.asia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voice.moly.asia/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 요청 본문 상한 — 채팅/일기 텍스트 API라 크게 필요 없음
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # LLM 응답 생성이 길어질 수 있음 — 일반 API보다 넉넉히
        proxy_read_timeout 120s;
    }
}
